    <title>

   </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script>
       function setup() {
          createCanvas(400, 400);
       }

       function draw() {
          background(220);
          textSize(22)
	  text("Self Portrait", 10,50);
          text("Sam Bullard", 10,375);
          fill(245, 232, 206)
          rect(175, 300, 50, 1250)
          circle(200, 200, 200)
          fill(87, 59, 4)
          ellipse(200, 140, 200, 80)  
          fill(78, 207, 230)
          circle(240, 200, 50)
          circle(160, 200, 50)
          strokeWeight(10);
          fill(0);
          line(215, 200, 185, 200)
          point(240,200);
          point(160,200);
          fill(250, 78, 62)
          triangle(250, 250, 200, 300, 150, 250)
       }
    </script>

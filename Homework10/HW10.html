<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js">
    var x = 50;
    var y = 50;

    function setup() {
      createCanvas(800, 600);
    }

    function draw() {
      background(0);
      fill(200, 0, 0);
      circle(x, y, 50);
    }
    
    if (x <= 0) {
      x = 50;
    }
    else if (x >= 800) {
      x = 50;
    }
  </script>
